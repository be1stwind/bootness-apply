<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f4d017">
<title>인스타 수익화 스타터 키트 · 부트니스</title>
<meta name="description" content="질문 12개, 3분이면 받는 주제 진단 결과지와 내 분야 사례 모음">
<meta property="og:title" content="인스타 수익화 스타터 키트">
<meta property="og:description" content="질문 12개 · 3분 — 주제 진단 결과지와 내 분야 사례 모음 · 11월 부트니스 무료특강 참여 리워드">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<!-- 「인스타 수익화 스타터 키트」(옛 「내 계정 찾기」) 웹 리워드 — 2026-11-16 뚝딱이 · MacminiM4. 흐름: app.js · 설정: config.js · 추천 주제: data.js -->
<style>
:root{--bg:#fff;--ink:#141414;--sub:#555;--mute:#8c8c8c;--hair:#dcdcdc;--yel:#f4d017;--red:#d93025;--paper:#fff;--line:#dcdcdc;--yel2:#fff3b0;--soft:#e6e6e6}
/* 11/20 안쪽 화면을 표지(A 포스터)와 한 벌로 — 흰 바탕 · 페이퍼로지 · 노랑/검정/흰색 + 본문 회색. 상자·둥근 모서리·그림자 대신 굵은 줄 · 여백 · 글자 크기 */
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:Paperlogy,"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;font-weight:600;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
.scr{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:18px 22px calc(36px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.sample{background:#7a5af8;color:#fff;font-size:12.5px;font-weight:700;text-align:center;padding:5px 8px}
.loaderr{padding:40px 20px;text-align:center;color:var(--sub)}

@font-face{font-family:"Paperlogy";src:url(fonts/Paperlogy-6SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Paperlogy";src:url(fonts/Paperlogy-7Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Paperlogy";src:url(fonts/Paperlogy-8ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
/* 표지 — 11/19 대표 확정 A 포스터(캔버스 최종본 v42). 글꼴 페이퍼로지 */
#cover{background:var(--yel);max-width:none;padding:0}
#cover .cv{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:560px;font-family:Paperlogy,"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink)}
#cover .cvy{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 24px 26px}
#cover .cvb{align-self:flex-start;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px 11px;font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.2;white-space:nowrap}
#cover .cvs{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding-top:20px}
#cover .cvbox{position:relative;align-self:flex-start;width:342px;height:318px}
#cover .cvg{position:relative;width:100%;height:100%}
#cover .cvg-in{position:absolute;left:0;top:0;width:342px;height:318px;transform-origin:top left;display:flex;flex-direction:column;justify-content:flex-end}
#cover .t1{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-1.8px;margin:0 0 10px 4px;white-space:nowrap}
#cover .t2{font-size:126px;font-weight:800;line-height:.86;letter-spacing:-8.4px;white-space:nowrap}
#cover .t2+.t2{margin-top:4px}
#cover .cvm{position:absolute;right:0;bottom:0;margin:0;width:max-content;white-space:nowrap;font-size:var(--m,24px);font-weight:700;line-height:1.42;letter-spacing:-.3px;text-align:right}
#cover .cvw{flex-shrink:0;background:#fff;padding:26px 24px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
#cover .cvi{display:grid;grid-template-columns:66px 1fr;column-gap:12px;align-items:baseline}
#cover .cvi .lb{font-size:14px;font-weight:800;letter-spacing:-.2px}
#cover .cvi .nm{font-size:19px;font-weight:800;letter-spacing:-.6px;line-height:1.3}
#cover .cvi .ds{margin-top:4px;font-size:14.5px;font-weight:600;color:#4a4a4a;line-height:1.5;letter-spacing:-.2px}
#cover .btn{margin-top:6px;height:58px;padding:0 12px;border-radius:29px;font-family:inherit;font-size:18px;font-weight:800;letter-spacing:-.3px}
@media (min-width:420px){#cover .cv .cvb{font-size:18px}#cover .cvy,#cover .cvw{padding-left:26px;padding-right:26px}}
/* 단추 — 표지 단추와 같은 검은 알약 */
.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;font-family:inherit;font-size:18px;font-weight:800;letter-spacing:-.3px;padding:17px 16px;text-align:center;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(1px)}
.btn.yel{background:var(--yel);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);border:0;font-size:16px;font-weight:700;padding:13px 12px;text-decoration:underline;text-underline-offset:4px}
.btn[disabled]{background:#bdbdbd;color:#fff;cursor:default}
.small{font-size:13px;color:var(--sub)}

/* 머리 — 검은 알약 하나 + 굵은 진행 줄 */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;font-weight:800;letter-spacing:-.2px;margin-bottom:14px}
.top .step{flex:none;background:var(--ink);color:#fff;border-radius:999px;padding:7px 13px 8px;font-size:13.5px;font-weight:800;line-height:1.2;white-space:nowrap}
.bar{height:4px;background:var(--soft);overflow:hidden;margin-bottom:28px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s}
h2{font-size:31px;font-weight:800;line-height:1.24;letter-spacing:-1.2px;margin:0 0 14px}
h2 .hl{background:none;padding:0}
h2.tq{font-size:25px;line-height:1.32;letter-spacing:-.8px}
h3{font-size:20px;font-weight:800;margin:26px 0 10px;letter-spacing:-.5px}
.lead{color:var(--sub);margin:0 0 22px}
.lead b{color:var(--ink);font-weight:800}
.back{background:none;border:0;padding:14px 0;margin-top:10px;color:var(--sub);font-size:15px;font-weight:700;cursor:pointer;align-self:flex-start}

/* 문항 — 상자 대신 굵은 줄로 나눈 줄. 누르면 노랑 면 */
.qn{font-size:15px;font-weight:800;letter-spacing:-.2px;margin:0 0 8px}
.opts{display:flex;flex-direction:column;margin:0 -12px;border-top:2.5px solid var(--ink)}
.opt{display:flex;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:19px 12px;font-size:19px;font-weight:700;letter-spacing:-.4px;line-height:1.35;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .12s}
.opt .no{margin-left:auto;font-size:20px;line-height:1;color:var(--sub);flex:none}
.opts.tight .opt{padding:14px 12px;font-size:16.5px}
.opt.none{color:var(--mute)}
.opt.on,.opt:active{background:var(--yel);color:var(--ink)}
.btn.chg{margin-top:8px}

/* 두 유형 고르기 */
.card{background:transparent;border:0;border-top:2.5px solid var(--ink);border-radius:0;padding:18px 0 20px;margin:0}
.tcard{cursor:pointer;text-align:left;width:100%;display:block;-webkit-tap-highlight-color:transparent}
.tcard:active{background:var(--yel)}
.tcard h4{font-size:23px;font-weight:800;letter-spacing:-.8px;line-height:1.3;margin:0 0 6px}
.tcard p{margin:0;font-size:15.5px;color:var(--sub)}
/* 할 얘기 찾기 들어가는 말 — 왼쪽 색 띠 없이 큰 글씨 인용 */
.quote{border-top:2.5px solid var(--ink);padding:18px 0 0;margin:6px 0 22px;font-size:16px;color:var(--sub)}
.quote b{display:block;font-size:22px;font-weight:800;line-height:1.38;letter-spacing:-.6px;color:var(--ink);margin-bottom:10px}
.quote .by{display:block;margin-top:10px;font-size:14px;font-weight:800;color:var(--ink)}
/* 분야 고르기 */
.chips{display:flex;flex-direction:column;margin:0 -12px;border-top:2.5px solid var(--ink)}
.chip{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:13px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip .nm{font-size:17.5px;font-weight:800;letter-spacing:-.4px;line-height:1.35}
.chip .ht{font-size:13.5px;color:var(--sub);margin-top:3px;line-height:1.45}
.chip.big{padding:18px 12px}
.chip.big .nm{font-size:21px}
.chip.on,.chip:active{background:var(--yel)}
.chips + .btn{margin-top:18px}
.stick{margin:16px 0 0}

/* 결과 — 큰 제목 → 캡처용 카드(노랑 한 장) → 1 · 2 → 다음 순서 */
.save{font-size:13.5px;color:var(--sub);margin:0 0 4px;line-height:1.55}
.tc{background:var(--yel);color:var(--ink);border-radius:0;padding:18px 20px 20px;margin:6px 0 12px;overflow:hidden}
.tc .brand{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:-.2px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.tc .tags{display:flex;flex-wrap:wrap;margin:0 0 8px;font-size:15px;font-weight:800;letter-spacing:-.3px}
.tc .tags span{background:none;padding:0}
.tc .tags span+span::before{content:"·";margin:0 7px}
.tc .lb{font-size:13px;font-weight:800;margin-bottom:4px}
.tc .line{font-size:27px;font-weight:800;line-height:1.3;letter-spacing:-1px}
.tc .sub{font-size:15px;margin-top:8px}
.tc .lad{margin-top:18px;border-top:2px solid var(--ink);display:flex;flex-direction:column;font-size:15px;line-height:1.45}
.tc .lad .cap{margin:10px 0 2px;font-size:12.5px;font-weight:800}
.tc .lad div{display:flex;gap:10px;padding:8px 0;border-top:1px solid rgba(20,20,20,.3)}
.tc .lad .cap + div{border-top:0}
.tc .lad small{flex:none;width:62px;font-size:12.5px;font-weight:800;padding-top:2px}
.tc .lad span{font-weight:700}
.tc .lad .l3 span{font-size:16.5px;font-weight:800}
.tc .ft{margin:16px -20px 0;background:var(--ink);color:#fff;padding:12px 20px 13px;font-size:13px;font-weight:700;line-height:1.45}
.sec{display:flex;align-items:baseline;gap:12px;margin:46px 0 18px;padding-top:14px;border-top:3px solid var(--ink)}
.sec .n{flex:none;font-size:40px;font-weight:800;line-height:1;letter-spacing:-1px}
.sec h3{margin:0;font-size:24px;line-height:1.25;letter-spacing:-.8px}
.rbox{margin:0 0 6px}
.rbox .k{font-size:13.5px;font-weight:800;color:var(--sub)}
.rbox .t{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1.28;margin:4px 0 0}
.rbox p{margin:10px 0 0;font-size:16px;line-height:1.65}
.pk{margin-top:20px;padding-top:12px;border-top:1.5px solid var(--ink)}
.pk.bare{margin-top:0;padding-top:0;border-top:0}
.pkk{font-size:13.5px;font-weight:800;color:var(--sub);margin-bottom:6px}
.pk ul{list-style:none;margin:0;padding:0}
.pk li{display:flex;gap:10px;font-size:16px;font-weight:800;line-height:1.4;padding:8px 0;border-top:1px solid var(--hair)}
.pk li:first-child{border-top:0}
.pk li small{flex:none;width:96px;font-size:13px;font-weight:700;color:var(--sub);padding-top:2px}
.pk .mn{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.4;margin-bottom:4px}
.lnk{background:none;border:0;padding:6px 0;font:inherit;font-size:14.5px;font-weight:800;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.sub4{font-size:19px;font-weight:800;letter-spacing:-.5px;margin:32px 0 10px}
.nt{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.nt li{padding:11px 0;border-bottom:1px solid var(--hair);font-size:15.5px;line-height:1.6}
.hint{font-size:14.5px;line-height:1.65;color:var(--sub);margin:14px 0 0}
.hint.note{font-size:15px;color:var(--ink);font-weight:700}
.lead.sm{font-size:14.5px;margin:-4px 0 12px}
.recs{display:flex;flex-direction:column;margin:0 -12px 6px;border-top:1.5px solid var(--ink)}
.recbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:12px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.recbtn small{font-size:12.5px;font-weight:700;color:var(--sub)}
.recbtn span{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.4}
.recbtn.on{background:var(--yel)}
.recbtn.on small{color:var(--ink)}
.recs.ref .recbtn{cursor:default;background:transparent;border-bottom:1px solid var(--hair)}
.recs.ref .recbtn span{font-weight:700}
.mine{font-size:14.5px;line-height:1.6;color:var(--sub);margin:2px 0 12px}
/* 11/23 결과 강약 — 노란 카드 대신: 1번 유형은 노란 상자, 2번 주제는 굵은 테두리 상자(마지막 칸 형광), 할 일 목록은 번호 */
.tybox{background:var(--yel);padding:18px 18px 20px;margin:0 0 8px}
.tybox .k{font-size:13px;font-weight:800}
.tybox .t{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1.25;margin:4px 0 8px}
.tybox p{margin:0;font-size:15.5px;line-height:1.65}
.show{list-style:none;margin:10px 0 0;padding:0}
.show li{position:relative;padding:6px 0 6px 18px;font-size:15px;line-height:1.6}
.show li .dot,.show li:before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;background:var(--ink);display:block}
.tbox{border:3px solid var(--ink);padding:16px 18px 14px;margin:0 0 8px}
.tbox .k{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:4px}
.tbox > .t{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1.28}
.tbox > p{margin:10px 0 2px;font-size:15.5px;line-height:1.65}
.tbox .lad div{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--hair)}
.tbox .lad div:first-child{border-top:0}
.tbox .lad small{flex:none;width:64px;font-size:12.5px;font-weight:800;color:var(--sub)}
.tbox .lad span{font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.4}
.tbox .lad .l3 span{font-size:21px;letter-spacing:-.6px}
.tbox .lad .l3 em{font-style:normal;background:linear-gradient(transparent 52%,var(--yel) 52%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tbox .ln{margin-top:6px;padding-top:12px;border-top:2px solid var(--ink)}
.tbox .ln small{display:block;font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:4px}
.tbox .ln b{font-size:18px;font-weight:800;letter-spacing:-.4px;line-height:1.45}
.tbox .lnk{margin-top:6px}
.rest .pk:first-child{margin-top:18px}
ul.how,ol.nt{counter-reset:n;border-top:0}
ul.how li,ol.nt li{position:relative;padding:12px 0 12px 40px;counter-increment:n}
ul.how li .no,ol.nt li .no{display:block;position:absolute;left:0;top:12px;width:26px;height:26px;background:var(--ink);color:#fff;font-size:14px;font-weight:800;line-height:26px;text-align:center}
ul.how li:first-child,ol.nt li:first-child{border-top:1.5px solid var(--ink)}
.cap3{font-size:15px;font-weight:800;color:var(--sub);margin:-6px 0 12px;letter-spacing:-.3px}
/* 다음 순서 — 라이브 날짜와 리워드 둘이 가장 크게 */
.sec + .livebox{margin-top:0}
.livebox{margin:0 0 6px}
.livebox .k{font-size:14px;font-weight:800;color:var(--sub);margin-bottom:4px}
.livebox .d{font-size:34px;font-weight:800;letter-spacing:-1.4px;line-height:1.2}
.livebox .t{font-size:17px;font-weight:800;letter-spacing:-.4px;margin-top:8px}
.livebox p{margin:12px 0 0;font-size:15.5px;color:var(--sub)}
.livebox .rw{border-top:3px solid var(--ink);padding-top:14px;margin-top:22px}
.livebox .rw + .rw{margin-top:20px}
.livebox .rw b{display:inline-block;background:var(--yel);font-size:14.5px;font-weight:800;line-height:1.3;padding:5px 10px 6px;margin-bottom:10px}
.livebox .rw span{display:block;font-size:18.5px;font-weight:800;letter-spacing:-.5px;line-height:1.45}
.livebox .where{font-size:13.5px;margin-top:16px}
/* 사례 모음 받기 — 화면에서 가장 큰 단추 */
.ebk{border-top:3px solid var(--ink);padding-top:18px;margin:38px 0 6px}
.ebk .k{font-size:13.5px;font-weight:800;color:var(--sub)}
.ebk h4{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.28;margin:6px 0 10px}
.ebk p{margin:0 0 12px;font-size:15.5px;color:var(--sub)}
.ebk .inside{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-wrap:wrap;font-size:16px;font-weight:800}
.ebk .inside li+li::before{content:"·";margin:0 8px}
.ebk .btn,.donebox .btn{background:var(--ink);color:#fff;font-size:20px;padding:21px 16px}
.ebk .soon{font-size:15px;color:var(--sub)}
.how{margin:0;padding:0;list-style:none;border-top:1.5px solid var(--ink)}
.how li{padding:12px 0;border-bottom:1px solid var(--hair);font-size:15.5px}
.how b{display:block;font-size:16px;margin-bottom:2px}
.again{background:none;border:0;color:var(--sub);text-decoration:underline;text-underline-offset:3px;font-size:15px;font-weight:700;padding:14px;cursor:pointer;display:block;margin:22px auto 0}
/* (11/19부터 화면에서 안 씀) 유형 상자 · 수익화 길 */
.mytopic{margin:0 0 10px;font-size:16px;color:var(--sub)}
.mytopic b{color:var(--ink);font-weight:800}
.mytype{background:var(--yel);padding:18px;margin-bottom:8px}
.mytype .k{font-size:13px;font-weight:800}
.mytype .t{font-size:24px;font-weight:800;margin:2px 0 6px}
.mytype p{margin:0;font-size:15px}
.money{border-top:3px solid var(--ink);padding:16px 0 14px;margin:12px 0}
.money .k{font-size:13px;font-weight:800;color:var(--sub)}
.money h4{font-size:19px;font-weight:800;line-height:1.4;margin:3px 0 10px}
.money ul{margin:0;padding:0;list-style:none}
.money .ways li{font-size:15px;line-height:1.55;padding:8px 0;border-top:1px solid var(--hair)}
.money .ways b{display:block;font-size:15.5px}
.money .first{margin-top:6px}
.money .first small{font-size:12.5px;font-weight:800}
.money .first li{font-size:14.5px;line-height:1.5;margin-top:3px}
.money .nt{font-size:12.5px;color:var(--sub);margin:8px 0 0;border:0}

/* 받은 뒤 */
.donebox{padding-top:4px;margin-bottom:34px}
.donebox h2{margin:0 0 10px}
.donebox p{margin:0 0 22px;color:var(--sub)}
.donebox + .livebox{border-top:3px solid var(--ink);padding-top:16px}
