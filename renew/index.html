<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>멤버십 만기일 조회 · 부트니스</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
  <style>
    :root {
      --yellow: #f4d017;
      --yellow-soft: #fdf6cf;
      --ink: #383839;
      --sub: #6b6b6e;
      --line: #e6e6e8;
      --bg: #f6f6f4;
      --card: #ffffff;
      --red: #c4372f;
      --red-soft: #fdeceb;
      --green: #2f7d4f;
      --green-soft: #e8f5ed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Paperlogy, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }
    .top {
      background: var(--yellow);
      padding: 28px 20px 64px;
      text-align: center;
    }
    .logo { display: block; height: 44px; width: auto; margin: 0 auto; }
    .brand {
      display: inline-block;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      background: var(--ink);
      color: var(--yellow);
      padding: 5px 10px;
      border-radius: 999px;
    }
    .top h1 {
      margin: 14px 0 6px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .top p {
      margin: 0;
      font-size: 14px;
      color: #4a4a20;
    }
    .wrap {
      max-width: 440px;
      margin: -44px auto 40px;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 6px 24px rgba(56, 56, 57, 0.08);
    }
    label {
      display: block;
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
    }
    .field + .field { margin-top: 18px; }
    input {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font: inherit;
      font-size: 17px;
      color: var(--ink);
      background: #fff;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--ink); }
    input.pin { letter-spacing: 0.15em; font-weight: 700; }
    input::placeholder { color: #c4c4c8; font-weight: 400; letter-spacing: normal; opacity: 1; }
    .btn {
      display: block;
      width: 100%;
      height: 54px;
      margin-top: 22px;
      border: 0;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      line-height: 54px;
      text-decoration: none;
    }
    .btn:disabled { background: #b5b5b8; cursor: default; }
    .btn.yellow { background: var(--yellow); color: var(--ink); }
    .btn.ghost { background: transparent; color: var(--sub); border: 1.5px solid var(--line); margin-top: 12px; }
    .note {
      margin: 14px 0 0;
      font-size: 13px;
      color: var(--sub);
      line-height: 1.6;
      text-align: center;
    }
    .msg {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: var(--red-soft);
      color: var(--red);
      font-size: 15px;
      line-height: 1.6;
      display: none;
    }
    .msg small { display: block; margin-top: 6px; color: #8a4b47; font-size: 13px; }

    /* 결과 */
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
    }
    .badge.renew { background: var(--yellow); color: var(--ink); }
    .badge.ok, .badge.lifetime { background: var(--green-soft); color: var(--green); }
    .badge.expired { background: var(--red-soft); color: var(--red); }
    .date-label { margin: 22px 0 4px; font-size: 14px; color: var(--sub); }
    .date { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
    .dday { margin-top: 6px; font-size: 15px; font-weight: 700; color: var(--sub); }
    .dday.hot { color: var(--red); }
    .lead { margin: 20px 0 0; font-size: 16px; line-height: 1.7; }
    .box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: var(--yellow-soft);
      font-size: 15px;
      line-height: 1.7;
    }
    .box b { font-weight: 800; }
    .box .row + .row { margin-top: 4px; }
    .hidden { display: none !important; }
    .foot { max-width: 440px; margin: 0 auto 32px; padding: 16px 16px 0; border-top: 1px solid var(--line); text-align: center; font-size: 12px; line-height: 1.7; color: var(--sub); }
    .foot p { margin: 0 0 6px; } .foot span { white-space: nowrap; } .foot a { color: var(--sub); }
  </style>
</head>

    var API = 'https://script.google.com/macros/s/AKfycbyiNYh5rqfu3N5TxsmESxSM_LDp4a5q-E8UmuyRwSyGZYi8g25Jzyd2VaJlqXMuzq8/exec';
    var $ = function (id) { return document.getElementById(id); };

    $('last4').addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '').slice(0, 4);
    });
    ['name', 'last4'].forEach(function (id) {
      $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });
    });
    $('searchBtn').addEventListener('click', search);
    $('againBtn').addEventListener('click', function () {
      $('resultCard').classList.add('hidden');
      $('formCard').classList.remove('hidden');
      $('last4').value = '';
      $('name').focus();
    });

    function showMsg(text, hint) {
      $('msg').innerHTML = '';
      $('msg').appendChild(document.createTextNode(text));
      if (hint) {
        var s = document.createElement('small');
        s.textContent = hint;
        $('msg').appendChild(s);
      }
      $('msg').style.display = 'block';
    }

    function setBusy(on) {
      $('searchBtn').disabled = on;
      $('searchBtn').textContent = on ? '조회하는 중…' : '조회하기';
    }

    function search() {
      var name = $('name').value.trim();
      var last4 = $('last4').value.trim();
      $('msg').style.display = 'none';
      if (!name) { showMsg('성함을 적어 주세요.'); $('name').focus(); return; }
      if (last4.length !== 4) { showMsg('연락처 뒤 4자리를 적어 주세요.'); $('last4').focus(); return; }
      setBusy(true);
      // 11/26 대표 「앱스크립트 말고 그냥 페이지로」 — 조회는 기존 앱스 스크립트에 POST(개인정보를 주소에 싣지 않음)
      fetch(API, { method: 'POST', headers: { 'content-type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ name: name, last4: last4 }) })
        .then(function (res) { return res.json(); })
        .then(function (r) { setBusy(false); r.ok ? render(r) : showMsg(r.message, r.hint); })
        .catch(function () { setBusy(false); showMsg('잠시 연결이 원활하지 않아요. 조금 뒤에 다시 해 주세요.'); });
    }

    function render(r) {
      var badge = $('badge'), lead = $('lead'), dday = $('dday'), box = $('renewBox'), btn = $('renewBtn');
      badge.className = 'badge ' + r.status;
      dday.className = 'dday';
      box.classList.add('hidden');
      btn.classList.add('hidden');
      $('date').textContent = r.status === 'lifetime' ? '평생 회원' : r.expiry + ' (' + r.weekday + ')';

      if (r.status === 'renew') {
        badge.textContent = '연장 대상이에요';
        dday.textContent = '만기까지 ' + r.daysLeft + '일 남았어요';
        if (r.daysLeft <= 14) dday.className = 'dday hot';
        lead.textContent = '이번 만기에 연장하시면 지금처럼 멤버십 혜택을 이어서 받으실 수 있어요.';
        var rows = [];
        if (r.renew.price) rows.push('<div class="row">연장가 <b>' + esc(r.renew.price) + '</b></div>');
        if (r.renew.deadline) rows.push('<div class="row">마감 <b>' + esc(r.renew.deadline) + '</b></div>');
        if (r.renew.after) rows.push('<div class="row">' + esc(r.renew.after) + '</div>');
        if (!rows.length) rows.push('<div class="row">연장 방법은 멤버십 공지방에서 안내해 드려요.</div>');
        box.innerHTML = rows.join('');
        box.classList.remove('hidden');
        if (r.renew.link) { btn.href = r.renew.link; btn.classList.remove('hidden'); }
      } else if (r.status === 'ok') {
        badge.textContent = '멤버십 이용 중';
        dday.textContent = '만기까지 ' + r.daysLeft + '일 남았어요';
        lead.textContent = '이미 연장하셨다면 이렇게 다음 만기일이 보여요. 따로 하실 일은 없어요.';
      } else if (r.status === 'lifetime') {
        badge.textContent = '평생 회원';
        dday.textContent = '';
        lead.textContent = '만기 없이 계속 이용하실 수 있어요.';
      } else {
        badge.textContent = '만기가 지났어요';
        dday.textContent = Math.abs(r.daysLeft) + '일 전에 끝났어요';
        dday.className = 'dday hot';
        lead.textContent = '다시 함께하고 싶으시면 ' + r.contact;
      }

      $('formCard').classList.add('hidden');
      $('resultCard').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
  </script>
</body>
</html>
