<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4d017">
<meta name="robots" content="noindex">
<title>소식 그만 받기 · 부트니스</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!--
  광고성 정보 수신 철회 — 정보통신망법 제50조 제5항 제1호
  「수신거부·수신동의 철회를 회피·방해하는 조치」를 해서는 안 된다.
  그래서 이 장은 일부러 **가장 단순하게** 만든다:
    · 로그인·본인확인을 요구하지 않는다
    · 「왜 그만 받으시나요」를 묻지 않는다
    · 다른 곳으로 문의를 넘기지 않는다 — 여기서 끝낸다
    · 번호가 없어도 「없는 번호입니다」라고 말하지 않는다(남의 번호를 넣어 가입 여부를 캐지 못하게)
-->
<style>
:root{
  --paper:#faf7ef; --card:#fff; --ink:#383839; --sub:#6e6a60; --line:#e6dfcc;
  --accent:#6b4c9a; --err:#c0392b; --ok:#2f7d4f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.band{height:6px;background:var(--accent)}
.in{padding:26px 22px}
h1{margin:0 0 6px;font-size:24px;line-height:1.35}
.lead{margin:0 0 22px;color:var(--sub);font-size:15px}
label{display:block;font-weight:700;font-size:15px;margin:0 0 8px}
input[type=tel]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fffdf8;
  border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;-webkit-appearance:none;appearance:none}
input[type=tel]:focus{border-color:var(--ink)}
.bad input[type=tel]{border-color:var(--err)}
.err{display:none;margin:7px 2px 0;color:var(--err);font-size:13.5px}
.bad .err{display:block}
button{width:100%;margin-top:18px;font:inherit;font-size:17px;font-weight:700;color:#1e2a33;
  background:#f4d017;border:0;border-radius:12px;padding:15px 0;cursor:pointer}
button[disabled]{opacity:.55;cursor:default}
.note{margin:18px 2px 0;font-size:13.5px;color:var(--sub)}
.done{display:none;text-align:center;padding:14px 0 4px}
.done h2{margin:0 0 10px;font-size:22px}
.done p{margin:0 0 6px;color:var(--sub);font-size:15px}
.tick{font-size:34px;line-height:1;color:var(--ok)}
.done .when{font-size:13.5px;color:var(--sub);margin:0 0 14px}
.done .retry{font-size:13.5px;margin:0 0 16px}
.done .retry a{color:var(--sub)}
.foot{margin:18px 2px 0;font-size:13px;color:var(--sub);text-align:center}
.foot a{color:var(--sub)}
@media (max-width:420px){ h1{font-size:21px} .in{padding:22px 18px} }
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <div class="band" aria-hidden="true"></div>
    <div class="in">
      <div id="ask">
        <h1>소식 그만 받기</h1>
        <p class="lead">부트니스의 강의·특강 소식을 더 받지 않으시려면, 소식을 받으시던 휴대폰 번호를 적어 주세요. 바로 처리됩니다.</p>
        <form id="f" novalidate>
          <div id="q">
            <label for="phone">휴대폰 번호</label>
            <input type="tel" id="phone" inputmode="numeric" maxlength="13" autocomplete="tel" placeholder="01012345678">
            <p class="err" id="e">휴대폰 번호를 숫자로만 적어 주세요 (예: 01012345678)</p>
          </div>
          <button type="submit" id="go">그만 받기</button>
        </form>
        <p class="note">신청하신 강의 안내처럼 <b>꼭 필요한 연락</b>은 계속 드립니다. 그만 받으시는 것은 <b>할인·모집 소식</b>이에요.</p>
      </div>
      <!--
        완료 화면은 **무엇을 언제 처리했는지**를 글로 밝힌다 (정보통신망법 제50조 제7항 — 처리 결과를 알려야 한다).
        그리고 **적으신 번호를 그대로 되비춘다.** 오타를 친 분이 「됐다」고 믿고 떠나면
        실제로는 철회가 안 된 채로 남기 때문이다. 번호는 방금 본인이 적은 값이라 되비춰도 새로 드러나는 것이 없다.
        ⚠️ 화면 고지만으로 제7항이 채워지는지는 시행령을 아직 못 봤다 — 모자라면 통지 수단을 더 붙인다.
      -->
      <div class="done" id="done">
        <p class="tick">✓</p>
        <h2>처리됐어요</h2>
        <p><b id="doneNum"></b> 로 가는 강의·특강 소식을 <b>지금부터 보내지 않습니다.</b></p>
        <p class="when" id="doneAt"></p>
        <p class="retry">혹시 번호를 잘못 적으셨다면 <a href="#" id="again">다시 해 주세요</a>.</p>
        <p>그동안 함께해 주셔서 고마웠습니다.</p>
      </div>
    </div>
  </div>
  <p class="foot"><a href="https://apply.btns.kr/privacy/">개인정보처리방침</a></p>
</main>
<script>
(function () {
  var EP = 'https://script.google.com/macros/s/AKfycbxjd7-hFlao-hi2A-kB4Rg1OC1NbCBneBieqWA9lCkKUWk3c1Gv7D3hNlpKf6VloYnF/exec';
  var f = document.getElementById('f'), q = document.getElementById('q'), e = document.getElementById('e');
  var phone = document.getElementById('phone'), go = document.getElementById('go');

  // 「다시 해 주세요」 — 번호를 잘못 적으셨을 때 바로 되돌아온다
  document.getElementById('again').addEventListener('click', function (ev) {
    ev.preventDefault();
    document.getElementById('done').style.display = 'none';
    document.getElementById('ask').style.display = 'block';
    q.classList.remove('bad');
    go.disabled = false; go.textContent = '그만 받기';
    phone.value = ''; phone.focus();
  });

  phone.addEventListener('input', function () {
    phone.value = phone.value.replace(/\D/g, '').slice(0, 11);
    q.classList.remove('bad');
  });

  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = phone.value.replace(/\D/g, '');
    if (!/^01\d{8,9}$/.test(v)) { e.textContent = '휴대폰 번호를 숫자로만 적어 주세요 (예: 01012345678)'; q.classList.add('bad'); phone.focus(); return; }
    go.disabled = true; go.textContent = '처리하는 중…';
    // text/plain 으로 보내야 브라우저가 사전 확인(preflight) 없이 바로 보낸다 — 신청폼과 같은 방식
    fetch(EP, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ kind: 'optout', phone: v }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw new Error('fail');
        // 적으신 번호를 그대로 되비춘다 — 오타를 스스로 알아채시게
        document.getElementById('doneNum').textContent = v.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
        document.getElementById('doneAt').textContent = j.at ? j.at + ' 에 처리했습니다.' : '';
        document.getElementById('ask').style.display = 'none';
        document.getElementById('done').style.display = 'block';
        window.scrollTo(0, 0);
      })
      .catch(function () {
        e.textContent = '잠깐 연결이 불안정해요. 다시 눌러 주세요.';
        q.classList.add('bad');
        go.disabled = false; go.textContent = '그만 받기';
      });
  });
})();
</script>
</body>
</html>
